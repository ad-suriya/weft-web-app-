# Netlify hosting for the Task Weave dashboard frontend.
#
# In the Netlify UI, set the site's "Base directory" to `Dashboard/frontend`
# so this file, the build command, and the publish dir all resolve here.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api/* to the FastAPI backend (Render — see render.yaml). Server-side
# proxy so the browser stays same-origin with the API. Update the host here if
# Render assigns the service a different subdomain, then redeploy.
[[redirects]]
  from = "/api/*"
  to = "https://task-weave-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: serve the built index.html for any route that isn't a static
# asset. Must come after the /api rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
